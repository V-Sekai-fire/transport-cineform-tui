# The option parsing gate. Twelve of its thirty checks are command lines that MUST be
# refused; two real defects came out of writing them, and both would have produced a
# successful encode rather than an error.
name: proof
on: [push, pull_request]

jobs:
  build-and-prove:
    # This half links no codec, so it is not held to x86_64 the way the encoder is and
    # macos-latest (arm64) is fair game. The pairing is deliberate: if the encoder ever
    # grows a NEON path, this job already proves the transport side runs there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the pinned dependencies
        run: |
          set -eux
          git clone --filter=blob:none --no-checkout https://github.com/V-Sekai-fire/contract-bus thirdparty/harness
          git -C thirdparty/harness checkout b3acc3be2e00cc2fa25d9d325aa7935c187ea0a2
          git clone --depth 1 --branch v1.6.1 https://github.com/laurencelundblade/QCBOR thirdparty/harness/libs/qcbor
          git clone --depth 1 https://github.com/V-Sekai-fire/interactor-cineform thirdparty/interactor-cineform
          git clone --filter=blob:none --no-checkout https://github.com/ArthurSonzogni/FTXUI thirdparty/ftxui
          git -C thirdparty/ftxui checkout 182ef70cd4dc1109d06e66361a9da86445928578
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Prove the option parsing
        run: ./build/cineform-tui-proof-options
